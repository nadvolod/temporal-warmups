<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 920 520" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowBig">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <!-- Nexus payment dot path: validate → nexus pause → nexus resume → execute -->
    <path id="nexusPayPath" d="M 88,195 L 248,195 L 380,195 L 380,195 L 380,195 L 560,195 L 560,195 L 720,195 L 848,195" fill="none"/>

    <!-- REST payment dot path: validate → call → FAIL -->
    <path id="restPayPath" d="M 88,390 L 248,390 L 380,390 L 460,390" fill="none"/>
  </defs>

  <!-- Background -->
  <rect width="920" height="520" fill="url(#bgGrad)" rx="12"/>

  <!-- Title -->
  <text x="460" y="34" text-anchor="middle" fill="#e6edf3" font-size="17" font-weight="700">Durability Across the Nexus Boundary</text>
  <text x="460" y="54" text-anchor="middle" fill="#8b949e" font-size="12">What happens when the Compliance worker dies mid-request?</text>

  <!-- ════════════════════ NEXUS SECTION (top) ════════════════════ -->

  <!-- Section label -->
  <rect x="30" y="74" width="860" height="28" rx="6" fill="#f97316" fill-opacity="0.08" stroke="#f97316" stroke-opacity="0.3"/>
  <text x="460" y="93" text-anchor="middle" fill="#f97316" font-size="12" font-weight="700" letter-spacing="0.06em">TEMPORAL + NEXUS</text>

  <!-- Timeline axis -->
  <line x1="60" y1="240" x2="880" y2="240" stroke="#30363d" stroke-width="1"/>
  <text x="60" y="258" fill="#484f58" font-size="9">t=0</text>
  <text x="880" y="258" text-anchor="end" fill="#484f58" font-size="9">t=done</text>

  <!-- Payment Workflow lane -->
  <text x="30" y="120" fill="#3b82f6" font-size="11" font-weight="700">PAYMENT WORKFLOW</text>

  <!-- Step: Validate -->
  <rect x="60" y="155" width="170" height="50" rx="8" fill="#1c2128" stroke="#3b82f6" stroke-opacity="0.5"/>
  <text x="145" y="176" text-anchor="middle" fill="#3b82f6" font-size="10" font-weight="600">Step 1</text>
  <text x="145" y="192" text-anchor="middle" fill="#e6edf3" font-size="11" font-weight="600">validatePayment</text>

  <!-- Arrow validate → nexus call -->
  <line x1="230" y1="180" x2="268" y2="180" stroke="#3b82f6" stroke-width="1.5" stroke-dasharray="4 3"/>
  <polygon points="265,175 275,180 265,185" fill="#3b82f6"/>

  <!-- Step: Nexus Call -->
  <rect x="275" y="155" width="130" height="50" rx="8" fill="#1c2128" stroke="#f97316" stroke-opacity="0.6"/>
  <text x="340" y="176" text-anchor="middle" fill="#f97316" font-size="10" font-weight="600">Nexus Call</text>
  <text x="340" y="192" text-anchor="middle" fill="#e6edf3" font-size="11">checkCompliance</text>

  <!-- Paused state (pulsing) -->
  <rect x="420" y="148" width="120" height="64" rx="8" fill="#1c2128" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="6 4">
    <animate attributeName="stroke-opacity" values="0.3;0.8;0.3" dur="2s" repeatCount="indefinite"/>
  </rect>
  <text x="480" y="172" text-anchor="middle" fill="#f59e0b" font-size="18">
    &#x23F8;
    <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite"/>
  </text>
  <text x="480" y="193" text-anchor="middle" fill="#f59e0b" font-size="10" font-weight="600">PAUSED</text>
  <text x="480" y="206" text-anchor="middle" fill="#8b949e" font-size="9">waiting for Nexus</text>

  <!-- Arrow: paused → resumed -->
  <line x1="540" y1="180" x2="568" y2="180" stroke="#22c55e" stroke-width="1.5" stroke-dasharray="4 3"/>
  <polygon points="565,175 575,180 565,185" fill="#22c55e"/>

  <!-- Resumed label -->
  <text x="603" y="148" text-anchor="middle" fill="#22c55e" font-size="10" font-weight="600">&#x25B6; RESUMED</text>

  <!-- Step: Nexus result returns -->
  <rect x="570" y="155" width="130" height="50" rx="8" fill="#1c2128" stroke="#22c55e" stroke-opacity="0.5"/>
  <text x="635" y="176" text-anchor="middle" fill="#22c55e" font-size="10" font-weight="600">Result Returns</text>
  <text x="635" y="192" text-anchor="middle" fill="#e6edf3" font-size="11">&#x2705; approved</text>

  <!-- Arrow result → execute -->
  <line x1="700" y1="180" x2="728" y2="180" stroke="#3b82f6" stroke-width="1.5" stroke-dasharray="4 3"/>
  <polygon points="725,175 735,180 725,185" fill="#3b82f6"/>

  <!-- Step: Execute -->
  <rect x="735" y="155" width="145" height="50" rx="8" fill="#1c2128" stroke="#22c55e" stroke-opacity="0.5"/>
  <text x="808" y="176" text-anchor="middle" fill="#3b82f6" font-size="10" font-weight="600">Step 3</text>
  <text x="808" y="192" text-anchor="middle" fill="#22c55e" font-size="11" font-weight="600">COMPLETED &#x2705;</text>

  <!-- Compliance Worker lane -->
  <text x="30" y="238" fill="#22c55e" font-size="11" font-weight="700">COMPLIANCE WORKER</text>

  <!-- Alive bar -->
  <rect x="60" y="265" width="340" height="22" rx="4" fill="#22c55e" fill-opacity="0.15" stroke="#22c55e" stroke-opacity="0.3"/>
  <text x="230" y="280" text-anchor="middle" fill="#22c55e" font-size="10" font-weight="600">&#x2714; RUNNING</text>

  <!-- Kill marker -->
  <line x1="400" y1="260" x2="400" y2="295" stroke="#ef4444" stroke-width="2.5"/>
  <text x="400" y="310" text-anchor="middle" fill="#ef4444" font-size="11" font-weight="700">&#x2715; KILLED</text>
  <text x="400" y="323" text-anchor="middle" fill="#8b949e" font-size="9">Ctrl+C</text>

  <!-- Dead gap -->
  <rect x="400" y="265" width="165" height="22" rx="4" fill="#ef4444" fill-opacity="0.08" stroke="#ef4444" stroke-opacity="0.3" stroke-dasharray="6 4"/>
  <text x="482" y="280" text-anchor="middle" fill="#ef4444" font-size="10">DOWN</text>

  <!-- Restart marker -->
  <line x1="565" y1="260" x2="565" y2="295" stroke="#22c55e" stroke-width="2.5"/>
  <text x="565" y="310" text-anchor="middle" fill="#22c55e" font-size="11" font-weight="700">&#x25B6; RESTART</text>

  <!-- Alive bar (restarted) -->
  <rect x="565" y="265" width="315" height="22" rx="4" fill="#22c55e" fill-opacity="0.15" stroke="#22c55e" stroke-opacity="0.3"/>
  <text x="722" y="280" text-anchor="middle" fill="#22c55e" font-size="10" font-weight="600">&#x2714; RUNNING — picks up where it left off</text>

  <!-- Outcome callout -->
  <rect x="620" y="330" width="260" height="30" rx="6" fill="#22c55e" fill-opacity="0.1" stroke="#22c55e" stroke-opacity="0.3"/>
  <text x="750" y="350" text-anchor="middle" fill="#22c55e" font-size="12" font-weight="700">Zero data loss. Zero retries by you.</text>

  <!-- ════════════════════ REST SECTION (bottom) ════════════════════ -->

  <!-- Section label -->
  <rect x="30" y="370" width="860" height="28" rx="6" fill="#ef4444" fill-opacity="0.08" stroke="#ef4444" stroke-opacity="0.3"/>
  <text x="460" y="389" text-anchor="middle" fill="#ef4444" font-size="12" font-weight="700" letter-spacing="0.06em">TRADITIONAL REST / HTTP</text>

  <!-- Payment lane -->
  <text x="30" y="418" fill="#3b82f6" font-size="11" font-weight="700">PAYMENT SERVICE</text>

  <!-- Step: Validate -->
  <rect x="60" y="430" width="170" height="42" rx="8" fill="#1c2128" stroke="#3b82f6" stroke-opacity="0.4"/>
  <text x="145" y="456" text-anchor="middle" fill="#e6edf3" font-size="11">validatePayment</text>

  <!-- Arrow validate → REST call -->
  <line x1="230" y1="451" x2="268" y2="451" stroke="#3b82f6" stroke-width="1.5" stroke-dasharray="4 3"/>
  <polygon points="265,446 275,451 265,456" fill="#3b82f6"/>

  <!-- REST Call box -->
  <rect x="275" y="430" width="130" height="42" rx="8" fill="#1c2128" stroke="#ef4444" stroke-opacity="0.5"/>
  <text x="340" y="449" text-anchor="middle" fill="#ef4444" font-size="10" font-weight="600">HTTP POST</text>
  <text x="340" y="463" text-anchor="middle" fill="#e6edf3" font-size="11">/api/compliance</text>

  <!-- BOOM -->
  <text x="440" y="456" fill="#ef4444" font-size="24" font-weight="700">
    &#x1F4A5;
  </text>

  <!-- Failure box -->
  <rect x="465" y="428" width="200" height="46" rx="8" fill="#ef4444" fill-opacity="0.1" stroke="#ef4444" stroke-opacity="0.5"/>
  <text x="565" y="448" text-anchor="middle" fill="#ef4444" font-size="11" font-weight="700">CONNECTION RESET</text>
  <text x="565" y="464" text-anchor="middle" fill="#8b949e" font-size="10">Transaction lost. 3am page.</text>

  <!-- Compliance lane -->
  <text x="30" y="495" fill="#22c55e" font-size="11" font-weight="700">COMPLIANCE SERVICE</text>

  <!-- Alive bar -->
  <rect x="60" y="500" width="340" height="16" rx="4" fill="#22c55e" fill-opacity="0.12" stroke="#22c55e" stroke-opacity="0.2"/>

  <!-- Kill marker -->
  <line x1="400" y1="496" x2="400" y2="520" stroke="#ef4444" stroke-width="2"/>
  <text x="412" y="514" fill="#ef4444" font-size="9" font-weight="700">&#x2715; DEAD</text>

  <!-- Dead gap -->
  <rect x="400" y="500" width="480" height="16" rx="4" fill="#ef4444" fill-opacity="0.06" stroke="#ef4444" stroke-opacity="0.15" stroke-dasharray="6 4"/>

  <!-- Outcome callout -->
  <rect x="700" y="430" width="180" height="40" rx="6" fill="#ef4444" fill-opacity="0.1" stroke="#ef4444" stroke-opacity="0.3"/>
  <text x="790" y="446" text-anchor="middle" fill="#ef4444" font-size="11" font-weight="700">You write: retry loops,</text>
  <text x="790" y="462" text-anchor="middle" fill="#ef4444" font-size="11" font-weight="700">DLQs, circuit breakers</text>

  <!-- Animated data dot — Nexus path -->
  <g filter="url(#glow)">
    <circle r="7" fill="#3b82f6">
      <animateMotion dur="8s" repeatCount="indefinite"
        keyPoints="0;0.15;0.25;0.25;0.25;0.45;0.65;0.85;1"
        keyTimes="0;0.12;0.2;0.45;0.55;0.65;0.78;0.9;1"
        calcMode="linear">
        <mpath xlink:href="#nexusPayPath"/>
      </animateMotion>
      <!-- blue → orange(nexus) → amber(paused) → green(resumed) → blue(execute) → green(done) -->
      <animate attributeName="fill"
        values="#3b82f6;#3b82f6;#f97316;#f59e0b;#f59e0b;#22c55e;#3b82f6;#22c55e;#22c55e"
        keyTimes="0;0.12;0.2;0.25;0.45;0.55;0.78;0.9;1"
        dur="8s" repeatCount="indefinite"/>
      <!-- Pulse larger during pause -->
      <animate attributeName="r"
        values="7;7;10;12;12;10;7;7;7"
        keyTimes="0;0.12;0.2;0.25;0.45;0.55;0.65;0.9;1"
        dur="8s" repeatCount="indefinite"/>
      <!-- Dim during pause -->
      <animate attributeName="opacity"
        values="1;1;1;0.5;0.5;1;1;1;1"
        keyTimes="0;0.12;0.2;0.25;0.45;0.55;0.65;0.9;1"
        dur="8s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Label follows the Nexus dot -->
  <text font-size="7" font-weight="700" fill="#fff" text-anchor="middle" dy="-13">
    <animateMotion dur="8s" repeatCount="indefinite"
      keyPoints="0;0.15;0.25;0.25;0.25;0.45;0.65;0.85;1"
      keyTimes="0;0.12;0.2;0.45;0.55;0.65;0.78;0.9;1"
      calcMode="linear">
      <mpath xlink:href="#nexusPayPath"/>
    </animateMotion>
    TXN-B
  </text>

  <!-- Animated data dot — REST path (goes to explosion) -->
  <g filter="url(#glow)">
    <circle r="6" fill="#3b82f6">
      <animateMotion dur="4s" repeatCount="indefinite"
        keyPoints="0;0.3;0.6;0.8;0.8"
        keyTimes="0;0.25;0.5;0.7;1"
        calcMode="linear">
        <mpath xlink:href="#restPayPath"/>
      </animateMotion>
      <animate attributeName="fill"
        values="#3b82f6;#3b82f6;#ef4444;#ef4444;#ef4444"
        keyTimes="0;0.25;0.5;0.7;1"
        dur="4s" repeatCount="indefinite"/>
      <animate attributeName="opacity"
        values="1;1;1;0;0"
        keyTimes="0;0.25;0.5;0.7;1"
        dur="4s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
